[package]
name = "slopd-acp"
version = "0.1.0"
edition = "2024"
description = "ACP adapter exposing slopd-managed agent panes over stdio"

[dependencies]
libslop = { path = "../libslop" }
libslopctl = { path = "../libslopctl" }
libslopiroh = { path = "../libslopiroh" }
iroh = "0.97"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
libsloptest = { path = "../libsloptest" }

[lints]
workspace = true
