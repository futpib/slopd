name: CI

on:
  push:
  pull_request:

jobs:
  android-flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:compileDebugKotlin -x :app:compileFlutterBuildDebug
        working-directory: android-app/android

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y tmux
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: cargo llvm-cov --workspace --all-features --no-report -- --test-threads=1
      # Tests spawn the slopd daemon and kill it; a killed process cannot flush
      # its .profraw, leaving a corrupt file that aborts the whole profdata
      # merge. Drop those files before generating the report.
      - name: Remove corrupt profraw files
        run: |
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin/llvm-profdata"
          if [ ! -x "$llvm_profdata" ]; then
            echo "llvm-profdata not found: $llvm_profdata" >&2
            exit 1
          fi
          find target/llvm-cov-target -name '*.profraw' | while read -r f; do
            if ! "$llvm_profdata" show "$f" > /dev/null 2>&1; then
              echo "Removing corrupt profraw: $f"
              rm -f "$f"
            fi
          done
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
