[package]
name = "libslopiroh"
version = "0.1.0"
edition = "2024"
description = "Shared iroh client transport and configuration for slopd clients"

[dependencies]
libslop = { path = "../libslop" }
iroh = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.1"
getrandom = "0.4"
data-encoding = "2"

[lints]
workspace = true
