name: slopd_control
description: "slop Android client for managing slopd over SSH and Iroh."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  dartssh2: ^4.1.0
  openkeychain_ssh:
    git:
      url: https://github.com/futpib/iroh-ssh-android.git
      ref: fa6e0cf0a6be499e778f93cf77483c6c7ee1fcef
      path: packages/openkeychain_ssh
  flutter_secure_storage: ^11.2.0
  ffi: ^2.2.0
  file_picker: ^13.1.0
  pinenacl: ^0.6.0
  crypto: ^3.0.7
  flutter_zxing: ^2.2.1
  yaml_writer: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true
